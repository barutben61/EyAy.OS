name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [yetkilendirme, dil_isleme, konusma, hafiza, sohbet, analiz]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
    
    - name: Install dependencies
      run: |
        cd hizmetler/${{ matrix.service }}
        poetry install
    
    - name: Run tests
      run: |
        cd hizmetler/${{ matrix.service }}
        poetry run pytest
    
    - name: Run linting
      run: |
        cd hizmetler/${{ matrix.service }}
        poetry run black --check .
        poetry run ruff check .

  build-images:
    needs: test-services
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push images
      run: |
        for service in yetkilendirme dil_isleme konusma hafiza sohbet analiz; do
          docker build -t eyayos/$service:latest ./hizmetler/$service
          docker push eyayos/$service:latest
        done

  deploy:
    needs: build-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy to production
      run: |
        echo "Production deployment would happen here"
